services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mdi}
      POSTGRES_USER: ${POSTGRES_USER:-mdi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdi-local-dev}
    ports:
      - "5432:5432"
    volumes:
      - mdi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mdi} -d $${POSTGRES_DB:-mdi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mdi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mdi-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mdi-local-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mdi_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional application services for Phase 6+
  # Uncomment to run the API and worker via compose:
  #
  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://mdi:mdi-local-dev@postgres:5432/mdi
  #     REDIS_URL: redis://redis:6379/0
  #     MINIO_ENDPOINT: http://minio:9000
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #
  # worker:
  #   build:
  #     context: .
  #     dockerfile: services/workers/Dockerfile
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://mdi:mdi-local-dev@postgres:5432/mdi
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api

volumes:
  mdi_postgres_data:
  mdi_redis_data:
  mdi_minio_data:
