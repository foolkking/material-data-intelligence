services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mdi
      POSTGRES_USER: mdi
      POSTGRES_PASSWORD: ${MDI_POSTGRES_PASSWORD:?Set MDI_POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - mdi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdi -d mdi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mdi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mdi_minio_data:/data

volumes:
  mdi_postgres_data:
  mdi_redis_data:
  mdi_minio_data:
