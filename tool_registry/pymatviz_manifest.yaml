  - tool_id: phonon.band
    source_package: mdi_adapters
    source_function: canonical_phonon_band
    implementation_source: pymatviz_composed
    stage: mvp
    adapter: PhononBandAdapter
    display_target: phonon
    artifact_types:
      - phonon_band_json
      - phonon_summary_json
      - phonon_report_json
      - phonon_manifest_json
      - plotly_json
      - table_json
      - recipe_json
    notes: Static phonon band ingestion and visualization for approved canonical phase10h JSON or bounded phonopy band.yaml input; preserves source branch order, negative frequencies, and path discontinuities. Excludes DOS, eigenvectors, animation, phonon calculation, and external resources.

  - tool_id: phonon.dos
    source_package: mdi_adapters
    source_function: canonical_phonon_dos
    implementation_source: pymatviz_composed
    stage: mvp
    adapter: PhononDosAdapter
    display_target: phonon
    artifact_types:
      - phonon_dos_json
      - phonon_summary_json
      - phonon_report_json
      - phonon_manifest_json
      - plotly_json
      - table_json
      - recipe_json
    notes: Static phonon DOS ingestion and visualization for approved canonical phase10h JSON or bounded phonopy total/projected text wrappers with explicit metadata; preserves negative frequencies, applies unit-density Jacobians, and validates total-mode normalization. Excludes bands, combined views, eigenvectors, animation, calculations, and external resources.

  - tool_id: phonon.band_dos
    source_package: mdi_adapters
    source_function: canonical_phonon_band_dos
    implementation_source: pymatviz_composed
    stage: mvp
    adapter: PhononBandDosAdapter
    display_target: phonon
    artifact_types:
      - phonon_band_dos_json
      - phonon_summary_json
      - phonon_compatibility_json
      - plotly_json
      - table_json
      - phonon_manifest_json
      - recipe_json
    notes: Strict composition of one validated phase10h.phonon_band.v1 artifact and one validated phase10h.phonon_dos.v1 artifact into an inert shared-frequency-axis band-left/DOS-right product. Enforces structure, atom ordering, lineage, force-constant, frequency, normalization, imaginary-mode, zero-tolerance, and NAC compatibility. Excludes eigenvectors, animation, thermal properties, phonon calculation, executable content, and external resources.

  - tool_id: phonon.animation
    source_package: mdi_adapters
    source_function: canonical_phonon_animation
    implementation_source: pymatviz_composed
    stage: mvp
    adapter: PhononAnimationAdapter
    display_target: phonon
    artifact_types:
      - phonon_animation_json
      - phonon_animation_summary_json
      - phonon_animation_manifest_json
      - recipe_json
    notes: Bounded visualization of one validated phonon eigenmode using an approved canonical structure, phonon band, and eigenvector-set binding. Produces an inert declarative package for the application-owned renderer; display amplitude is visual only, imaginary modes are not stable time oscillations, and no phonon calculation, executable content, remote asset, or external network is included.

  - tool_id: structure.xrd
    source_package: pymatgen
    source_class: XRDCalculator
    implementation_source: pymatviz_composed
    stage: mvp
    adapter: XrdPatternAdapter
    display_target: structure
    artifact_types:
      - table_json
      - plotly_json
      - summary_md
      - recipe_json
    notes: Static simulated XRD pattern for periodic crystalline structures using CuKa radiation; excludes experimental fitting and Rietveld refinement.

  - tool_id: structure.rdf
    source_package: pymatgen
    source_function: Structure.get_all_neighbors
    implementation_source: pymatviz_composed
    stage: mvp
    adapter: RdfAdapter
    display_target: structure
    artifact_types:
      - table_json
      - plotly_json
      - summary_md
      - recipe_json
    notes: Static radial distribution function for periodic crystalline structures using fixed bins and number-density normalization; excludes trajectory RDF, experimental PDF fitting, phonon DOS, 3D viewer, and local environment classification.

  - tool_id: structure.chem_env_sunburst
    source_package: pymatviz
    source_function: chem_env_sunburst
    implementation_source: pymatviz
    stage: v2
    adapter: ChemEnvSunburstAdapter
    display_target: structure
    notes: "Can be explored in late V1, but default planned stage is V2 due to local environment analysis complexity."
    artifact_types:
      - plotly_json
      - plotly_html
      - preview_png
      - summary_md
      - recipe_json
