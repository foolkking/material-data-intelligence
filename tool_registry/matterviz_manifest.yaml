version_baseline:
  matterviz: "current-compatible"
  pymatviz_widgets: "from pymatviz"

tools:
  - tool_id: structure.viewer_3d
    source_package: platform
    source_class: viewer_scene.v2
    implementation_source: platform_builtin
    stage: mvp
    adapter: StructureViewer3DAdapter
    display_target: structure
    notes: "Interactive crystal structure viewer backed by canonical inert viewer_scene.v2 artifacts with periodic bond endpoints; supports atoms, lattice, bounded periodic bonds, inspection, measurement, supercells, and basic camera controls with JSON fallback. Trajectories, phonons, volumetric data, and editing are not supported."
    artifact_types:
      - structure_json
      - table_json
      - summary_md
      - recipe_json

  - tool_id: trajectory.viewer
    source_package: pymatviz
    source_class: TrajectoryWidget
    implementation_source: matterviz
    stage: v1
    adapter: TrajectoryViewerAdapter
    display_target: trajectory
    artifact_types:
      - matterviz_html
      - summary_md
      - recipe_json
    optional_artifact_types:
      - matterviz_snapshot_png
