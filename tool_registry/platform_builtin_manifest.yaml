  - tool_id: structure.viewer_scene_metadata
    implementation_source: platform_builtin
    stage: mvp
    adapter: StructureViewerSceneMetadataAdapter
    display_target: structure
    notes: "Deprecated read-only compatibility producer for Phase 10D direct execution. Hidden from Mock Planner generation; historical artifacts remain JSON-only and are never reinterpreted as canonical topology."
    artifact_types:
      - structure_json
      - summary_md
      - recipe_json

  - tool_id: structure.viewer_scene
    implementation_source: platform_builtin
    stage: mvp
    adapter: StructureViewerSceneAdapter
    display_target: structure
    notes: Create an inert viewer_scene.v2 JSON artifact with canonical periodic bond endpoints and a manifest; the artifact embeds no JavaScript, renderer bundle, WebGL runtime, or external resources.
    artifact_types:
      - structure_json
      - table_json
      - summary_md
      - recipe_json

  - tool_id: structure.viewer_3d
    implementation_source: platform_builtin
    stage: mvp
    adapter: StructureViewer3DAdapter
    display_target: structure
    notes: "Production interactive periodic crystal structure viewer backed by canonical inert viewer_scene.v2 artifacts with periodic bond endpoints. Supports atoms, lattice, bounded periodic bonds, inspection, distance/angle/dihedral measurement, renderer-local supercells, clipping, camera controls, scientific export, accessibility, mobile use, and JSON fallback. Artifacts contain no renderer code. Trajectories, phonons, Brillouin zones, volumetric data, structure editing, and authoritative chemical topology are not supported."
    artifact_types:
      - structure_json
      - table_json
      - summary_md
      - recipe_json

  - tool_id: structure.viewer_export_package
    implementation_source: platform_builtin
    stage: mvp
    adapter: StructureViewerExportPackageAdapter
    display_target: structure
    notes: "Deprecated read-only compatibility producer for Phase 10D direct execution. Hidden from Mock Planner generation; historical packages remain JSON-only, include no renderer, and are not migrated into canonical topology."
    artifact_types:
      - structure_json
      - table_json
      - summary_md
      - recipe_json

  - tool_id: structure.trajectory_import
    implementation_source: platform_builtin
    stage: mvp
    adapter: TrajectoryImportAdapter
    display_target: trajectory
    notes: "Planner-hidden internal import closure for an already bounded and validated phase10g.trajectory.v1 normalized object. Emits inert trajectory, summary, parse-report, and manifest JSON only; no viewer, playback, HTML, JavaScript, remote frame, or external asset."
    artifact_types:
      - trajectory_json
      - trajectory_summary_json
      - trajectory_report_json
      - trajectory_manifest_json

  - tool_id: structure.trajectory_viewer
    implementation_source: platform_builtin
    stage: mvp
    adapter: TrajectoryViewerAdapter
    display_target: trajectory
    notes: "Inspect and play validated phase10g.trajectory.v1 atomic trajectories with stable atom identity, fixed or variable lattice, bounded frame navigation, picking, current-frame measurement, renderer-local supercells, clipping, camera controls, mobile policy, and JSON fallback. Static-reference bonds are partial and off by default. Dynamic bonds, variable atom count, analytics, editing, video export, artifact code, remote frames, and external network are not supported."
    artifact_types:
      - trajectory_json
      - trajectory_summary_json
      - trajectory_report_json
      - trajectory_manifest_json

