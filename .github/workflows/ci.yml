name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      replay_historical_browser_evidence:
        description: Replay sealed Phase 10/12 browser evidence in addition to current product gates
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests (no external services) ───────────────────────────────
  unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_KEY: ""
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --frozen --extra test

      - name: Initialize default SQLite schema for application unit tests
        run: uv run python -m alembic -c apps/api/alembic.ini upgrade head
        env:
          DATABASE_URL: sqlite:///./mdi_phase5.db

      - name: Run unit tests
        run: uv run python -m pytest -q -m "not integration and not qualification" --tb=short

      - name: Historical release evidence semantic validation
        if: github.event_name == 'workflow_dispatch' && inputs.replay_historical_browser_evidence
        run: >-
          uv run python -m pytest -q
          tests/test_phase13_0_release_scope.py
          tests/test_phase13_2_attempt6.py
          tests/test_phase13_3_documentation_reproducibility.py
          tests/test_phase13_4_targeted_polish.py
          tests/test_phase13_5_release_acceptance.py
          tests/test_phase13_6_final_archive.py
          --tb=short

      - name: uv lock check
        run: uv lock --check

  # ── Frontend typecheck + build ──────────────────────────────────────
  phase11-reproducibility-linux:
    name: Phase 11-3 Scientific Replay (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra test
      - name: Replay sealed invariant cases
        run: uv run python scripts/run_phase11_3_reproducibility.py --platform linux --output-dir "${RUNNER_TEMP}/phase11-3-linux"
      - name: Upload Linux reproducibility evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase11-3-linux-replay
          path: ${{ runner.temp }}/phase11-3-linux
          if-no-files-found: error

  phase11-reproducibility-windows:
    name: Phase 11-3 Scientific Replay (Windows)
    runs-on: windows-latest
    needs: phase11-reproducibility-linux
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            pyproject.toml
            uv.lock
            scripts/run_phase11_3_reproducibility.py
            docs/phase11/evidence/phase11_2_golden_scientific_benchmark
          sparse-checkout-cone-mode: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra test
      - name: Replay sealed invariant cases
        run: uv run python scripts/run_phase11_3_reproducibility.py --platform windows --output-dir "$env:RUNNER_TEMP\phase11-3-windows"
      - name: Download Linux reproducibility evidence
        uses: actions/download-artifact@v8
        with:
          name: phase11-3-linux-replay
          path: ${{ runner.temp }}/phase11-3-linux
      - name: Compare Linux and Windows evidence
        run: >-
          uv run python scripts/run_phase11_3_reproducibility.py
          --compare-linux "$env:RUNNER_TEMP\phase11-3-linux\linux_replay.json"
          --compare-windows "$env:RUNNER_TEMP\phase11-3-windows\windows_replay.json"
          --output-dir "$env:RUNNER_TEMP\phase11-3-cross-platform"
      - name: Upload cross-platform evidence
        uses: actions/upload-artifact@v7
        with:
          name: phase11-3-cross-platform-replay
          path: |
            ${{ runner.temp }}/phase11-3-windows
            ${{ runner.temp }}/phase11-3-cross-platform
          if-no-files-found: error

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: apps/web

      - name: Install pinned browser evidence runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web

      - name: Run frontend tests
        run: npm test
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Replay sealed historical browser evidence (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.replay_historical_browser_evidence
        run: node test/replay-sealed-browser-evidence.mjs
        working-directory: apps/web

      - name: Phase 12-6 responsive and accessibility evidence
        env:
          DEEPSEEK_KEY: ""
          MDI_PLAYWRIGHT_MODULE: ${{ github.workspace }}/apps/web/node_modules/playwright/index.mjs
          MDI_PHASE12_6_PORT: "3460"
        run: |
          node test/phase12-6-responsive-accessibility-browser-evidence.mjs
          cd ../..
          python scripts/generate_phase12_6_responsive_accessibility_evidence.py
        working-directory: apps/web

      - name: Phase 12-7 cross-product UX validation evidence
        env:
          DEEPSEEK_KEY: ""
          MDI_PLAYWRIGHT_MODULE: ${{ github.workspace }}/apps/web/node_modules/playwright/index.mjs
          MDI_PHASE12_7_PORT: "3461"
        run: |
          node test/phase12-7-cross-product-browser-evidence.mjs
          cd ../..
          python scripts/generate_phase12_7_cross_product_evidence.py
        working-directory: apps/web

  # ── Service-backed integration tests ───────────────────────────────
  integration:
    name: Service-backed Integration (PostgreSQL + Redis + MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdi
          POSTGRES_USER: mdi
          POSTGRES_PASSWORD: mdi-ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdi -d mdi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: mdi-ci
          MINIO_ROOT_PASSWORD: mdi-ci-pass
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        entrypoint: sh
        command: >
          -c "
          mkdir -p /data &&
          minio server /data --console-address :9001
          "

    env:
      DEEPSEEK_KEY: ""
      MDI_RUN_INTEGRATION: "1"
      DATABASE_URL: "postgresql+psycopg://mdi:mdi-ci-pass@localhost:5432/mdi"
      MDI_TEST_DATABASE_URL: "postgresql+psycopg://mdi:mdi-ci-pass@localhost:5432/mdi"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "mdi"
      POSTGRES_USER: "mdi"
      POSTGRES_PASSWORD: "mdi-ci-pass"
      REDIS_URL: "redis://localhost:6379/0"
      MDI_REDIS_URL: "redis://localhost:6379/0"
      MINIO_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "mdi-ci"
      MINIO_SECRET_KEY: "mdi-ci-pass"
      MINIO_BUCKET: "mdi-artifacts"
      MINIO_SECURE: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --frozen --extra test

      # GitHub services run pg_isready-compatible images, but we verify
      # via SQLAlchemy connection to catch DATABASE_URL misconfiguration.
      - name: Verify PostgreSQL connection
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          url = os.environ['DATABASE_URL']
          e = create_engine(url, future=True)
          with e.connect() as c:
              print(c.execute(text('SELECT 1 AS ok')).scalar())
          e.dispose()
          print('PostgreSQL connection OK')
          "

      - name: Run Alembic upgrade head
        run: |
          uv run python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Verify tables created by migration
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ['DATABASE_URL'], future=True)
          with e.connect() as c:
              r = c.execute(text(
                  \"SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name\"
              ))
              tables = {row[0] for row in r}
          expected = {
              'projects', 'datasets', 'data_profiles', 'analysis_intents',
              'analysis_intent_executions', 'analysis_plans',
              'capability_eligibility_resolutions', 'capability_planning_decisions',
              'capability_planning_executions',
              'plan_dependency_bindings', 'runtime_artifact_binding_resolutions',
              'dependency_execution_records', 'artifact_lineage_records',
              'scientific_evidence_bundles', 'scientific_interpretations',
              'scientific_interpretation_runs',
              'scientific_interpretation_claims', 'scientific_interpretation_evidence_links',
              'scientific_workspaces', 'workspace_panels', 'workspace_layout_revisions',
              'jobs', 'job_events', 'tool_calls',
              'artifacts', 'visualization_recipes', 'reports',
              'scientific_objects', 'scientific_object_versions',
              'scientific_object_relationships', 'research_turns',
              'research_context_snapshots', 'research_turn_events',
              'scientific_result_snapshots',
              'research_turn_decisions',
              'research_capability_resolutions',
              'research_capability_plans',
              'research_execution_summaries',
          }
          missing = expected - tables
          assert not missing, f'Missing tables after alembic upgrade: {missing}'
          print(f'Alembic tables OK: {len(expected)} of {len(expected)} expected tables present')
          e.dispose()
          "

      - name: Verify PostgreSQL indexes exist
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ['DATABASE_URL'], future=True)
          with e.connect() as c:
              r = c.execute(text(
                  \"SELECT indexname FROM pg_indexes WHERE schemaname='public' ORDER BY indexname\"
              ))
              indexes = {row[0] for row in r}
          expected = {
              'idx_job_events_job_seq',
              'idx_analysis_plans_project_created',
              'idx_analysis_plans_job',
              'idx_analysis_plans_plan_hash',
              'idx_analysis_intents_dataset_created',
              'idx_analysis_intents_parent',
              'idx_intent_executions_intent',
              'idx_capability_resolutions_intent',
              'idx_capability_decisions_intent',
              'idx_capability_decisions_resolution',
              'idx_capability_executions_intent',
              'idx_plan_dependency_bindings_plan',
              'idx_plan_dependency_bindings_graph',
              'idx_dependency_execution_plan',
              'idx_dependency_execution_job',
              'idx_runtime_binding_job',
              'idx_runtime_binding_artifact',
              'idx_artifact_lineage_job',
              'idx_artifact_lineage_plan',
              'idx_scientific_objects_project_lifecycle',
              'idx_scientific_object_versions_object',
              'idx_research_turns_session_sequence',
              'idx_research_turns_status_updated',
              'idx_research_turn_events_turn',
              'idx_scientific_result_snapshots_turn',
              'idx_research_turn_decisions_action_created',
              'idx_research_turn_decisions_fingerprint',
              'idx_research_execution_summaries_turn',
              'idx_research_execution_summaries_job',
              'idx_scientific_evidence_job',
              'idx_scientific_interpretation_runs_job',
              'idx_scientific_interpretations_job',
              'idx_scientific_interpretations_bundle',
              'idx_workspaces_project_updated',
              'idx_workspaces_source_job',
              'idx_workspace_panels_order',
              'idx_jobs_project_created',
              'idx_jobs_plan_id',
              'idx_tool_calls_job',
              'idx_artifacts_job',
              'idx_artifacts_project_created',
              'idx_reports_job',
          }
          missing = expected - indexes
          assert not missing, f'Missing indexes: {missing}'
          print(f'Alembic indexes OK: {len(expected)} found')
          e.dispose()
          "

      - name: Create MinIO bucket
        run: |
          uv run python -c "
          import boto3, os
          c = boto3.client('s3',
              endpoint_url=os.environ['MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['MINIO_SECRET_KEY'],
              region_name='us-east-1')
          c.create_bucket(Bucket=os.environ['MINIO_BUCKET'])
          print(f'MinIO bucket {os.environ[\"MINIO_BUCKET\"]} created')
          "

      - name: Run integration tests (capture output)
        run: |
          set +e
          uv run python -m pytest tests/test_phase6_integration.py tests/test_phase8b_persisted_plan_queue.py tests/integration/test_phase10_product_closure.py tests/integration/test_phase10l1_analysis_intent_service_backed.py tests/integration/test_phase10l2_capability_planner_service_backed.py tests/integration/test_phase10l3_dependency_service_backed.py tests/integration/test_phase10l4_interpretation_service_backed.py tests/integration/test_phase10l5_natural_language_service_backed.py tests/integration/test_phase10m1_workspace_service_backed.py tests/integration/test_phase10m5_report_recipe_service_backed.py tests/integration/test_phase10m6_workspace_recovery_service_backed.py tests/integration/test_phase10m7_workspace_integration_service_backed.py tests/integration/test_phase10n1_coordination_service_backed.py tests/integration/test_phase10n2_local_environment_service_backed.py tests/integration/test_phase10n3_experimental_xrd_service_backed.py tests/integration/test_phase10n4_trajectory_analytics_service_backed.py tests/integration/test_phase10n5_electronic_service_backed.py tests/integration/test_phase10n6_professional_closure_service_backed.py tests/integration/test_phase13_1_c2_resource_preflight_service_backed.py tests/integration/test_phase13_2_attempt3_service_backed.py tests/integration/test_agent2_phase1_service_backed.py tests/integration/test_agent2_phase2_service_backed.py tests/integration/test_agent2_phase3_service_backed.py tests/integration/test_agent2_phase4_service_backed.py tests/integration/test_agent2_phase5_service_backed.py tests/integration/test_agent2_phase6_service_backed.py tests/integration/test_agent2_phase7_service_backed.py tests/integration/test_agent2_phase8_service_backed.py tests/integration/test_agent2_phase9_service_backed.py -vv -m integration \
            --tb=long --color=yes 2>&1 | tee integration.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "${PYTEST_EXIT}" > integration.exit

      # ── P0 guard: zero-skip enforcement ──────────────────────────
      - name: Assert no integration tests skipped
        run: |
          PASSED=$(grep -o '[0-9]\+ passed' integration.log | head -1 | grep -o '[0-9]\+' || echo 0)
          SKIPPED=$(grep -o '[0-9]\+ skipped' integration.log | head -1 | grep -o '[0-9]\+' || echo 0)
          FAILED=$(grep -o '[0-9]\+ failed' integration.log | head -1 | grep -o '[0-9]\+' || echo 0)
          ERRORS=$(grep -o '[0-9]\+ errors\?' integration.log | head -1 | grep -o '[0-9]\+' || echo 0)
          PYTEST_EXIT=$(cat integration.exit)

          echo "=== Integration Summary ==="
          echo "  passed:  ${PASSED:-0}"
          echo "  skipped: ${SKIPPED:-0}"
          echo "  failed:  ${FAILED:-0}"
          echo "  errors:  ${ERRORS:-0}"
          echo "  pytest exit: ${PYTEST_EXIT}"
          echo "==========================="

          if [ "${PYTEST_EXIT}" -ne 0 ] || [ "${ERRORS:-0}" -gt 0 ]; then
            echo "ERROR: pytest did not complete successfully."
            cat integration.log
            exit 1
          fi

          # P0: zero skipping allowed
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo ""
            echo "ERROR: ${SKIPPED} integration test(s) skipped."
            echo "Expected: 0 skipped when MDI_RUN_INTEGRATION=1 and all services healthy."
            echo "Check: service health, env vars (DATABASE_URL, REDIS_URL, MINIO_*),"
            echo "       bucket existence, and pytest.skip() conditions in the test file."
            exit 1
          fi

          # P0: zero failures allowed
          if [ "${FAILED:-0}" -gt 0 ]; then
            echo ""
            echo "ERROR: ${FAILED} integration test(s) failed."
            cat integration.log
            exit 1
          fi

          # P0: every explicitly selected integration test must be collected and pass.
          if [ "${PASSED:-0}" -lt 50 ]; then
            echo ""
            echo "ERROR: Only ${PASSED:-0}/50 integration tests passed."
            echo "Expected: at least 50 passed, including the Phase 13 Attempt 3 failure gate."
            exit 1
          fi

          for REQUIRED_TEST in \
            test_agent2_phase3_postgresql_planning_is_idempotent_and_never_executes \
            test_agent2_phase4_fresh_worker_executes_exact_plan_and_stops_at_result_pending \
            test_agent2_phase5_rdf_fresh_process_auto_projection \
            test_agent2_phase5_xrd_two_step_fresh_process_auto_projection \
            test_agent2_phase7_rdf_non_adjacent_result_reuse_in_fresh_processes \
            test_agent2_phase7_xrd_result_reuse_is_not_rdf_specific \
            test_agent2_phase7_rdf_parameter_change_creates_real_continuation \
            test_agent2_phase7_stale_result_keeps_exact_historical_version \
            test_agent2_phase9_exact_version_viewers_load_in_fresh_process \
            test_agent2_phase9_selection_is_durable_and_zero_computation \
            test_agent2_phase9_dedicated_selection_has_no_skips \
            test_agent2_phase2_postgresql_orchestration_and_redis_wakeup_boundary \
            test_phase10l4_postgres_redis_minio_phonon_chain_interpretation \
            test_phase10l4_postgres_redis_minio_single_tool_interpretation \
            test_phase10l4_postgres_redis_minio_partial_execution_interpretation \
            test_phase10m1_postgres_redis_minio_workspace_domain_persistence \
            test_phase10m2_postgres_redis_minio_workspace_shell_api_contract \
            test_phase10m3_postgres_redis_minio_canonical_selection_and_pinning \
            test_phase10m5_postgres_redis_minio_report_recipe_composition \
            test_phase10m6_postgres_redis_minio_workspace_save_reload_recovery \
            test_phase10m7_postgres_redis_minio_workspace_integration_closure \
            test_phase10n1_postgres_redis_minio_coordination_artifact_closure \
            test_phase10n2_postgres_redis_minio_exact_n1_dependency_closure \
            test_phase10n3_postgres_redis_minio_theoretical_xrd_comparison_closure \
            test_phase10n4_postgres_redis_minio_msd_diffusion_dependency_closure \
            test_phase10n5_postgres_redis_minio_band_dos_closure \
            test_phase10n6_postgres_redis_minio_professional_integration_closure \
            test_phase13_1_postgres_redis_minio_c2_exact_resource_resolution \
            test_phase13_1_fix_forward_3_real_upload_to_fresh_worker_d0 \
            'test_phase10l5_postgres_redis_minio_natural_language_closure\[dataset\]' \
            'test_phase10l5_postgres_redis_minio_natural_language_closure\[structure\]' \
            'test_phase10l5_postgres_redis_minio_natural_language_closure\[materials_ml\]' \
            'test_phase10l5_postgres_redis_minio_natural_language_closure\[phonon\]' \
            'test_phase10l5_postgres_redis_minio_natural_language_closure\[volumetric\]'; do
            if ! grep -q "${REQUIRED_TEST}.*PASSED" integration.log; then
              echo "ERROR: Required Phase 10L service-backed test did not pass: ${REQUIRED_TEST}"
              exit 1
            fi
          done

          echo ""
          echo "All service-backed integration tests passed with 0 skipped."
