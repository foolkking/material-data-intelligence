name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests (no external services) ───────────────────────────────
  unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --frozen --extra test

      - name: Run unit tests
        run: uv run python -m pytest -q -m "not integration" --tb=short

      - name: uv lock check
        run: uv lock --check

  # ── Frontend typecheck + build ──────────────────────────────────────
  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web

  # ── Service-backed integration tests ───────────────────────────────
  integration:
    name: Service-backed Integration (PostgreSQL + Redis + MinIO)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdi
          POSTGRES_USER: mdi
          POSTGRES_PASSWORD: mdi-ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdi -d mdi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: mdi-ci
          MINIO_ROOT_PASSWORD: mdi-ci-pass
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -sf http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        entrypoint: sh
        command: >
          -c "
          mkdir -p /data &&
          minio server /data --console-address :9001
          "

    env:
      MDI_RUN_INTEGRATION: "1"
      DATABASE_URL: "postgresql+psycopg://mdi:mdi-ci-pass@localhost:5432/mdi"
      MDI_TEST_DATABASE_URL: "postgresql+psycopg://mdi:mdi-ci-pass@localhost:5432/mdi"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "mdi"
      POSTGRES_USER: "mdi"
      POSTGRES_PASSWORD: "mdi-ci-pass"
      REDIS_URL: "redis://localhost:6379/0"
      MDI_REDIS_URL: "redis://localhost:6379/0"
      MINIO_ENDPOINT: "http://localhost:9000"
      MINIO_ACCESS_KEY: "mdi-ci"
      MINIO_SECRET_KEY: "mdi-ci-pass"
      MINIO_BUCKET: "mdi-artifacts"
      MINIO_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --frozen --extra test

      # GitHub services run pg_isready-compatible images, but we verify
      # via SQLAlchemy connection to catch DATABASE_URL misconfiguration.
      - name: Verify PostgreSQL connection
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          url = os.environ['DATABASE_URL']
          e = create_engine(url, future=True)
          with e.connect() as c:
              print(c.execute(text('SELECT 1 AS ok')).scalar())
          e.dispose()
          print('PostgreSQL connection OK')
          "

      - name: Run Alembic upgrade head
        run: |
          uv run python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Verify tables created by migration
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ['DATABASE_URL'], future=True)
          with e.connect() as c:
              r = c.execute(text(
                  \"SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name\"
              ))
              tables = {row[0] for row in r}
          expected = {
              'projects', 'datasets', 'data_profiles',
              'jobs', 'job_events', 'tool_calls',
              'artifacts', 'visualization_recipes', 'reports',
          }
          missing = expected - tables
          assert not missing, f'Missing tables after alembic upgrade: {missing}'
          print(f'Alembic tables OK: {len(expected)} of {len(expected)} expected tables present')
          e.dispose()
          "

      - name: Verify PostgreSQL indexes exist
        run: |
          uv run python -c "
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ['DATABASE_URL'], future=True)
          with e.connect() as c:
              r = c.execute(text(
                  \"SELECT indexname FROM pg_indexes WHERE schemaname='public' ORDER BY indexname\"
              ))
              indexes = {row[0] for row in r}
          expected = {
              'idx_job_events_job_seq',
              'idx_jobs_project_created',
              'idx_tool_calls_job',
              'idx_artifacts_job',
              'idx_artifacts_project_created',
              'idx_reports_job',
          }
          missing = expected - indexes
          assert not missing, f'Missing indexes: {missing}'
          print(f'Alembic indexes OK: {len(expected)} found')
          e.dispose()
          "

      - name: Create MinIO bucket
        run: |
          uv run python -c "
          import boto3, os
          c = boto3.client('s3',
              endpoint_url=os.environ['MINIO_ENDPOINT'],
              aws_access_key_id=os.environ['MINIO_ACCESS_KEY'],
              aws_secret_access_key=os.environ['MINIO_SECRET_KEY'],
              region_name='us-east-1')
          c.create_bucket(Bucket=os.environ['MINIO_BUCKET'])
          print(f'MinIO bucket {os.environ[\"MINIO_BUCKET\"]} created')
          "

      - name: Run integration tests (capture output)
        run: |
          uv run python -m pytest tests/test_phase6_integration.py -q -m integration \
            --tb=long --color=yes 2>&1 | tee integration.log
        # Don't fail on pytest exit code yet — we parse the log below
        continue-on-error: true

      # ── P0 guard: zero-skip enforcement ──────────────────────────
      - name: Assert no integration tests skipped
        run: |
          PASSED=$(grep -oP '^\d+(?= passed)' integration.log | head -1 || echo 0)
          SKIPPED=$(grep -oP '^\d+(?= skipped)' integration.log | head -1 || echo 0)
          FAILED=$(grep -oP '^\d+(?= failed)' integration.log | head -1 || echo 0)

          echo "=== Integration Summary ==="
          echo "  passed:  ${PASSED:-0}"
          echo "  skipped: ${SKIPPED:-0}"
          echo "  failed:  ${FAILED:-0}"
          echo "==========================="

          # P0: zero skipping allowed
          if [ "${SKIPPED:-0}" -gt 0 ]; then
            echo ""
            echo "ERROR: ${SKIPPED} integration test(s) skipped."
            echo "Expected: 0 skipped when MDI_RUN_INTEGRATION=1 and all services healthy."
            echo "Check: service health, env vars (DATABASE_URL, REDIS_URL, MINIO_*),"
            echo "       bucket existence, and pytest.skip() conditions in the test file."
            exit 1
          fi

          # P0: zero failures allowed
          if [ "${FAILED:-0}" -gt 0 ]; then
            echo ""
            echo "ERROR: ${FAILED} integration test(s) failed."
            cat integration.log
            exit 1
          fi

          # P0: at least 18 passed
          if [ "${PASSED:-0}" -lt 18 ]; then
            echo ""
            echo "ERROR: Only ${PASSED:-0}/18 integration tests passed."
            echo "Expected: 18 passed."
            exit 1
          fi

          echo ""
          echo "All 18 integration tests passed with 0 skipped — Phase 6 live-verified."
